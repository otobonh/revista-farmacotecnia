$('toc').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(b){$('drawer').hidden=true;go(+b.dataset.p)}});
$('tocBtn').onclick=()=>{$('drawer').hidden=false;$('closeToc').focus()};
$('closeToc').onclick=()=>$('drawer').hidden=true;
$('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')$('drawer').hidden=true});
addEventListener('hashchange',()=>{const h=/^#p(\d+)$/.exec(location.hash);if(h&&+h[1]-1!==pf.getCurrentPageIndex())go(+h[1])});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fit,150)});
const first=new Image();first.onload=first.onerror=()=>{setTimeout(()=>{$('loader').style.opacity=0;setTimeout(()=>$('loader').hidden=true,500)},350)};first.src=src(1);
const m=/^#p(\d+)$/.exec(location.hash);if(m&&+m[1]>1){setTimeout(()=>{lazy(+m[1]-1);pf.turnToPage(+m[1]-1);ui()},50)}else ui();
setTimeout(()=>{$('hint').style.opacity=0},7000);
</script>
</body>
</html>
